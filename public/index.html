<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access Gateway</title>
    <style>
        body { 
            background: #2f3136; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .input-box {
            width: 80%;
            max-width: 500px;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #202225;
            background: #40444b;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        .btn { 
            color: #ffffff; 
            font-weight: bold; 
            font-size: 16px; 
            background: #5865F2; 
            padding: 12px 24px; 
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background: #4752C4; }
    </style>
</head>
<body>
    <h2>Secure Gateway Portal</h2>
    <p style="color: #b9bbbe; margin-bottom: 20px;">Establishing a masked data stream to bypass local filters:</p>
    <input type="text" id="urlInput" class="input-box" value="https://discord.com">
    <button onclick="launchSecureTunnel()" class="btn">Launch Session</button>

    <script>
        function launchSecureTunnel() {
            const input = document.getElementById('urlInput').value;
            // Routes requests through a trusted open-source proxy container network
            window.location.href = "https://images" + Math.floor(Math.random() * 10) + "://googleusercontent.com" + encodeURIComponent(input);
        }
    </script>
</body>
</html>
